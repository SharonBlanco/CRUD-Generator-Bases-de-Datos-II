services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crud_generator_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crud_test
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./extension/init-extension.sql:/docker-entrypoint-initdb.d/init-extension.sql
      - ./extension:/extension-custom

volumes:
  pgdata:
